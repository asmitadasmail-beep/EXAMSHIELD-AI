<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Exam Proctoring System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-copy">
                <p class="eyebrow">ExamGuard AI</p>
                <h1>Start your exam session</h1>
                <p class="message">Enter the details exactly as provided by your college before launching the proctoring flow.</p>
            </div>

            {% if error %}
            <div class="form-error" role="alert">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
                <label>
                    <span>Name</span>
                    <input type="text" name="name" value="{{ form_data.name }}" required>
                </label>

                <label>
                    <span>USN</span>
                    <input type="text" name="usn" value="{{ form_data.usn }}" required>
                </label>

                <label>
                    <span>Subject</span>
                    <input type="text" name="subject" value="{{ form_data.subject }}" required>
                </label>

                <label>
                    <span>Exam Code</span>
                    <input type="text" name="exam_code" value="{{ form_data.exam_code }}" required>
                </label>

                <button type="submit" class="primary-button">Start Exam</button>
            </form>
        </section>
    </main>
</body>
</html>
