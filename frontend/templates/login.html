<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidate Login | ExamShield AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="brand-block">
                    <div class="brand-mark" aria-hidden="true">E</div>
                    <div>
                        <div class="brand-title">ExamShield AI</div>
                        <div class="brand-subtitle">Secure online examinations</div>
                    </div>
                </div>
                <p class="eyebrow">Student access</p>
                <h1>Welcome back</h1>
                <p class="message">Enter the exam details provided by your institution to continue.</p>
            </div>

            {% if error %}
            <div class="form-error" role="alert">{{ error }}</div>
            {% endif %}

            <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
                <label>
                    <span>Name</span>
                    <input type="text" name="name" value="{{ form_data.name }}" required>
                </label>

                <label>
                    <span>USN</span>
                    <input type="text" name="usn" value="{{ form_data.usn }}" required>
                </label>

                <label>
                    <span>Subject</span>
                    <input type="text" name="subject" value="{{ form_data.subject }}" required>
                </label>

                <label>
                    <span>Exam Code</span>
                    <input type="text" name="exam_code" value="{{ form_data.exam_code }}" required>
                </label>

                <button type="submit" class="primary-button">Continue to dashboard</button>
            </form>
            <p class="message">Already registered? <a href="{{ url_for('auth.account_login') }}">Log in with email</a></p>
            <p class="message">New to ExamShield AI? <a href="{{ url_for('auth.register') }}">Create a student account</a></p>
        </section>
    </main>
</body>
</html>
