<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page_title }} | ExamShield AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="brand-block"><div class="brand-mark">E</div><div><div class="brand-title">ExamShield AI</div><div class="brand-subtitle">Student practice platform</div></div></div><p class="eyebrow">Account login</p><h1>Welcome back</h1></div>{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}<form class="auth-form" method="post"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Log in securely</button></form><p class="message">Need an account? <a href="{{ url_for('auth.register') }}">Register</a></p><p class="message">Teacher or Administrator? <a href="{{ url_for('admin.login') }}">Teacher &amp; Admin portal</a></p></section></main></body></html>
