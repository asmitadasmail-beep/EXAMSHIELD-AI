<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page_title }} | ExamShield AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="brand-block"><div class="brand-mark">E</div><div><div class="brand-title">ExamShield AI</div><div class="brand-subtitle">Student practice platform</div></div></div><p class="eyebrow">Create account</p><h1>Start practising</h1></div>{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}<form class="auth-form" method="post"><label>Full name<input name="name" value="{{ form_data.name }}" required></label><label>Student ID<input name="usn" value="{{ form_data.usn }}" required></label><label>Email<input type="email" name="email" value="{{ form_data.email }}" required></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="8" required></label><button class="primary-button" type="submit">Create account</button></form><p class="message">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></section></main></body></html>
