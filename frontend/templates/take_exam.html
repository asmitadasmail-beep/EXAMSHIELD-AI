<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page_title }} | ExamShield AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header exam-header"><div class="brand-block"><div class="brand-mark">E</div><div><div class="brand-title">ExamShield AI</div><div class="brand-subtitle">{{ attempt.subject_name }} · {{ attempt.exam_name }}</div></div></div><span class="status-badge status-success">Practice session</span></header>
<main class="exam-shell"><section class="question-panel"><div class="card-header-row"><p class="eyebrow">Multiple-choice examination</p><span id="saveStatus" class="status-badge status-neutral">Not started</span></div><div id="questionMount"></div><div class="exam-actions"><button class="secondary-button" id="previousQuestion" type="button">Previous</button><button class="primary-button" id="nextQuestion" type="button">Save & next</button></div><form id="submitForm" method="post" action="{{ url_for('learning.submit_exam', attempt_id=attempt.attempt_id) }}"><button class="primary-button" type="submit">Submit examination</button></form></section><aside class="palette-panel"><p class="eyebrow">Question palette</p><div id="questionPalette" class="question-palette"></div><p class="message">Answers are saved as you move between questions.</p></aside></main><script>window.examData={{ exam|tojson }};window.attemptId={{ attempt.attempt_id }};</script><script src="{{ url_for('static', filename='js/exam.js') }}"></script></body></html>
